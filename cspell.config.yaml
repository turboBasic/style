version: "0.2"
import:
  - "@cspell/dict-uk-ua/cspell-ext.json"
language: en,en-GB,uk
caseSensitive: false

dictionaryDefinitions:
  - name: project
    path: .cspell/project.txt
    description: names, tooling and identifiers specific to this repository
    addWords: true

dictionaries:
  - project
  - python
  - softwareTerms
  - software-tools

ignorePaths:
  - .git/**
  - .cspell/**
  - .ruff_cache/**
  - .pytest_cache/**
  - "**/__pycache__/**"
  - "**/.venv/**"
  - uv.lock

ignoreRegExpList:
  - /\b[0-9a-f]{7,40}\b/ # git object hashes
  - /(?<=https?:\/\/)\S+/ # URLs

overrides:
  - filename: "**/*.py"
    dictionaries:
      - python
